[project]
name = "text-resource-translator"
version = "0.1.0"
description = "LLM-based UI localization pipeline: PostgreSQL + pgvector + LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain>=0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings-local = ["langchain-huggingface>=0.1", "sentence-transformers>=3.0"]
embeddings-openai = ["langchain-openai>=0.2"]
llm-anthropic = ["langchain-anthropic>=0.2"]
sources = ["pypdf>=4.0", "polib>=1.2", "lxml>=5.0", "docx2txt>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
trt = "trt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/trt/cli.py" = ["B008"]  # typer.Option у дефолтах — стандартний патерн Typer

[tool.pytest.ini_options]
testpaths = ["tests"]
