services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: trt
      POSTGRES_PASSWORD: trt
      POSTGRES_DB: trt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trt -d trt"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      PG_DSN: postgresql+psycopg://trt:trt@db:5432/trt
      RAW_DIR: /data/raw
    volumes:
      - rawdata:/data/raw
    depends_on:
      db:
        condition: service_healthy
    command: ["trt", "schedule"]

volumes:
  pgdata:
  rawdata:
